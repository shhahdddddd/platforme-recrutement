version: "3.9"

services:
  # PostgreSQL Database (commented out - using local PostgreSQL instead)
  # postgres:
  #   image: ankane/pgvector:latest
  #   container_name: recruitment_postgres
  #   environment:
  #     POSTGRES_DB: recrutement
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: shahd123
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - recruitment_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis Service for Caching & Queues
  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - recruitment_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Keycloak IAM Service
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: recruitment_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - recruitment_network
    restart: unless-stopped

  # Laravel Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - recruitment_network

  # Laravel Queue Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_worker
    restart: unless-stopped
    command: php artisan queue:work
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - recruitment_network
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MailHog Service for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: recruitment_mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - recruitment_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  recruitment_network:
    driver: bridge