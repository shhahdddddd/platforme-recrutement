name: recrutitn
description: "RecrutiTN - Plateforme intelligente de recrutement"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  dartz: ^0.10.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  google_fonts: ^6.3.3
  image_picker: ^1.0.4
  file_picker: ^10.3.10
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.6.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.1.0
  fl_chart: ^1.1.1
  connectivity_plus: ^6.1.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/recrutitn_logo.png
