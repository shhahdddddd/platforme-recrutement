# =============================================================================
# RecrutiTN - Main Reverse Proxy & Load Balancer
# =============================================================================
# Routes all traffic to appropriate backend services
# Handles: SSL termination, WebSocket proxying, rate limiting, static files
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream Definitions (Backend Services)
# -----------------------------------------------------------------------------
upstream backend_api {
    server backend:9000 max_fails=3 fail_timeout=30s;
}

upstream ai_api {
    server ai:8002 max_fails=3 fail_timeout=30s;
}

# -----------------------------------------------------------------------------
# HTTP (Port 80) - Redirects to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;  # Catch-all

    # Health check endpoint (for load balancers)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ACME challenge for Let's Encrypt (SSL certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment after SSL setup)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # For now, proxy to HTTPS backends
    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# -----------------------------------------------------------------------------
# Backend API (Laravel) - /api/*
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name api.* api.recrutitn.*;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for long-running requests (file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for large responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

# -----------------------------------------------------------------------------
# AI Microservice - /ai/*
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name ai.* ai.recrutitn.*;

    location / {
        proxy_pass http://ai:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;  # AI tasks can be slow
        proxy_read_timeout 120s;
    }

    # Django Admin interface
    location /admin/ {
        proxy_pass http://ai:8002/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# -----------------------------------------------------------------------------
# WebSocket Configuration (Laravel Reverb)
# -----------------------------------------------------------------------------
server {
    listen 8081;
    server_name ws.* ws.recrutitn.*;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# -----------------------------------------------------------------------------
# WebSocket Configuration (Django Channels)
# -----------------------------------------------------------------------------
server {
    listen 8082;
    server_NAME ws-ai.* ai-ws.*;

    location / {
        proxy_pass http://ai:8002;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

