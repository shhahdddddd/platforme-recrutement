# =============================================================================
# RecrutiTN - Production Docker Compose
# =============================================================================
# Orchestrates: Database, Cache, Auth, Backend API, Admin Panel
# Version: 1.0.0
# Note: AI service runs separately (not dockerized)
# =============================================================================

version: "3.9"

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ==========================================================================
  # DATABASE LAYER
  # ==========================================================================
  
  # PostgreSQL with pgvector extension for AI embeddings
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: recrutement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recrutement}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-recrutement}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: postgres -c 'max_connections=200' -c 'shared_buffers=256MB'

  # Redis for caching, sessions, and message broker
  redis:
    image: redis:7.2-alpine
    container_name: recrutement_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # AUTHENTICATION LAYER
  # ==========================================================================
  
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: recrutement_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:?Keycloak admin password required}
      KC_FEATURES: token-exchange,admin-fine-grained-authz
    ports:
      - "8080:8080"
    volumes:
      - ./backend/docker/keycloak:/opt/keycloak/data/import:ro
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # BACKEND LAYER (Laravel PHP)
  # ==========================================================================
  
  # Main Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recrutement_backend
    restart: unless-stopped
    environment:
      # Database
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-recrutement}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Cache/Queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      
      # AI Service (runs on host, not dockerized)
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8002}
      AI_SERVICE_TIMEOUT: 120
      
      # Keycloak
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: recrutement
      
      # App Settings
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - backend_storage:/var/www/storage/app
      - backend_logs:/var/www/storage/logs
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Queue Worker
  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=default,high,emails
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-recrutement}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage/app
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2  # Scale workers based on load

  # Laravel Scheduler (Cron)
  backend_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recrutement_backend_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction --quiet; sleep 60; done"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # FRONTEND LAYER
  # ==========================================================================
  
  # Angular Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: recrutement_admin
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000/api
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4200:80"
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================================================
  # REVERSE PROXY LAYER
  # ==========================================================================
  
  nginx:
    image: nginx:1.25-alpine
    container_name: recrutement_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"  # WebSocket (Laravel)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # MONITORING (Optional - Enable for production)
  # ==========================================================================
  
  # Prometheus metrics (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: recrutement_prometheus
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - backend_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
  nginx_cache:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  backend_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
