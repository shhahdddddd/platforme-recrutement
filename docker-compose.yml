# =============================================================================
# RecrutiTN - Complete Production Docker Compose
# =============================================================================
# Orchestrates: Database, Cache, Auth, Backend API, AI Microservices, Admin Panel
# Version: 1.0.0
# =============================================================================

version: "3.9"

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ==========================================================================
  # DATABASE LAYER
  # ==========================================================================
  
  # PostgreSQL with pgvector extension for AI embeddings
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: recrutement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recrutement}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-recrutement}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: postgres -c 'max_connections=200' -c 'shared_buffers=256MB'

  # Redis for caching, sessions, and message broker
  redis:
    image: redis:7.2-alpine
    container_name: recrutement_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ChromaDB vector database for RAG
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: recrutement_chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma_data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma_data
    ports:
      - "8003:8000"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # AUTHENTICATION LAYER
  # ==========================================================================
  
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: recrutement_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:?Keycloak admin password required}
      KC_FEATURES: token-exchange,admin-fine-grained-authz
    ports:
      - "8080:8080"
    volumes:
      - ./backend/docker/keycloak:/opt/keycloak/data/import:ro
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # BACKEND LAYER (Laravel PHP)
  # ==========================================================================
  
  # Main Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recrutement_backend
    restart: unless-stopped
    environment:
      # Database
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-recrutement}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Cache/Queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      
      # AI Service
      AI_SERVICE_URL: http://ai:8002
      AI_SERVICE_TIMEOUT: 120
      
      # Keycloak
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: recrutement
      
      # App Settings
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
    volumes:
      - backend_storage:/var/www/storage/app
      - backend_logs:/var/www/storage/logs
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Queue Worker
  backend_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=default,high,emails
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-recrutement}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage/app
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2  # Scale workers based on load

  # Laravel Scheduler (Cron)
  backend_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recrutement_backend_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction --quiet; sleep 60; done"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # AI LAYER (Python/Django)
  # ==========================================================================
  
  # Django AI API
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: recrutement_ai
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: ai.settings
      
      # Database
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recrutement}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # Vector DB
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      
      # AI Models (External APIs preferred over local Ollama)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      
      # Backend Integration
      BACKEND_WEBHOOK_URL: http://backend:8000/api/webhooks/ai
    volumes:
      - ai_media:/app/media
      - ai_kb:/app/kb_documents
    ports:
      - "8002:8002"
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery Worker for AI Tasks
  ai_worker:
    build:
      context: ./ai
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: ai.settings
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recrutement}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHROMA_HOST: chromadb
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - ai_media:/app/media
      - ai_kb:/app/kb_documents
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ai:
        condition: service_started
    deploy:
      replicas: 2

  # Celery Beat (Scheduler)
  ai_beat:
    build:
      context: ./ai
      dockerfile: Dockerfile.beat
    container_name: recrutement_ai_beat
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: ai.settings
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-recrutement}
      CELERY_BROKER_URL: redis://redis:6379/1
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================================
  # FRONTEND LAYER
  # ==========================================================================
  
  # Angular Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: recrutement_admin
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000/api
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "4200:80"
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================================================
  # REVERSE PROXY LAYER
  # ==========================================================================
  
  nginx:
    image: nginx:1.25-alpine
    container_name: recrutement_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"  # WebSocket (Laravel)
      - "8082:8082"  # WebSocket (AI)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # MONITORING (Optional - Enable for production)
  # ==========================================================================
  
  # Prometheus metrics (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: recrutement_prometheus
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - backend_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local
  ai_media:
    driver: local
  ai_kb:
    driver: local
  nginx_cache:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  backend_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
