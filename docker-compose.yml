version: '3.8'

services:

  # ================= DATABASE =================
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: recrutement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recrutement}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-recrutement}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ================= REDIS =================
  redis:
    image: redis:7.2-alpine
    container_name: recrutement_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ================= KEYCLOAK (FIXED FOR 8081) =================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: recrutement_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      # ✅ FIX: Utilisation de localhost et du port 8081 pour la redirection VirtualBox
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ================= BACKEND =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recrutement_backend
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-recrutement}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8002}

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: recrutement

      APP_ENV: production
      APP_DEBUG: "false"
      # ✅ FIX: Le navigateur accède au backend via le port 8000
      APP_URL: http://localhost:8000

    volumes:
      - backend_storage:/var/www/storage/app
      - backend_logs:/var/www/storage/logs
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================= WORKER =================
  backend_worker:
    build:
      context: ./backend
    container_name: recruitment-backend_worker-1
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage/app
      - ./backend:/var/www:cached
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ================= SCHEDULER =================
  backend_scheduler:
    build:
      context: ./backend
    container_name: recrutement_backend_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  # ================= ADMIN =================
  admin:
    build:
      context: ./admin
    container_name: recrutement_admin
    restart: unless-stopped
    environment:
      # ✅ FIX: Utilisation des ports redirigés pour le navigateur Windows
      API_BASE_URL: http://localhost:8000/api
      KEYCLOAK_URL: http://localhost:8081
    ports:
      - "4200:80"
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy

  # ================= NGINX =================
  nginx:
    image: nginx:1.25-alpine
    container_name: recrutement_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - backend_network
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      # ✅ FIX: Test simplifié pour éviter le statut "unhealthy"
      test: ["CMD", "wget", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================= VOLUMES =================
volumes:
  postgres_data:
  redis_data:
  backend_storage:
  backend_logs:
  nginx_cache:

# ================= NETWORK =================
networks:
  backend_network:
    driver: bridge
